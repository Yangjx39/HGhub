name: Build Android APK

on:
  workflow_dispatch: # 允许你在 Actions 页面手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        # 根据项目需要，可能还需要额外安装 NDK，可通过下面的步骤补充

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10 # 项目要求 pnpm 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android APK
        run: pnpm android:build
        env:
          # 如果项目需要，在这里配置 ANDROID_HOME 等环境变量
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          # 产出的 APK 路径可能因项目结构而异，通常在此目录下
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
